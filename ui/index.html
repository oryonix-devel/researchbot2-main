<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResearchBot2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0f14;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b27;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #1a2a4a;
      color: #63b3ed;
      border: 1px solid #2b4c7e;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.8rem;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f7fafc;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .endpoints {
      text-align: left;
      background: #0d0f14;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .endpoints h2 {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #4a5568;
      margin-bottom: 0.75rem;
    }

    .endpoint {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid #1a202c;
      font-size: 0.83rem;
    }

    .endpoint:last-child { border-bottom: none; }

    .method {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: #1a3a2a;
      color: #68d391;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .path { color: #90cdf4; font-family: "SF Mono", "Fira Code", monospace; }
    .op   { color: #718096; font-size: 0.75rem; margin-left: auto; }

    .status {
      font-size: 0.78rem;
      color: #48bb78;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #48bb78;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Oryonix Platform</div>
    <h1>ResearchBot2</h1>
    <p class="subtitle">
      Temporal-durable research evaluation pipeline.<br />
      Powered by Gemini · Streamed via fc primitives.
    </p>

    <div class="endpoints">
      <h2>API Endpoints</h2>

      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/run</span>
        <span class="op">run_research_pipeline</span>
      </div>

      <div class="endpoint">
        <span class="method">POST</span>
        <span class="path">/api/approval</span>
        <span class="op">submit_approval</span>
      </div>
    </div>

    <div class="status">
      <div class="dot"></div>
      Service operational
    </div>
  </div>
</body>
</html>
